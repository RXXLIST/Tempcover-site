<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - TempCover</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #2B2F37; color: #FFFFFF; }
    .container { max-width: 64rem; margin: 0 auto; background-color: #1A1C22; padding: 2rem; border-radius: 0.5rem; margin-top: 6rem; }
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
    th, td { padding: 0.75rem; border: 1px solid #00FF99; text-align: left; }
    th { background-color: #00FF99; color: #2B2F37; font-weight: 600; }
    a { color: #00FF99; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn-primary { background-color: #00FF99; color: #2B2F37; font-weight: 600; transition: background-color 0.3s; }
    .btn-primary:hover { background-color: #00CC77; }
  </style>
</head>
<body>
  <header class="fixed top-0 w-full bg-[#2B2F37] shadow-md z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center py-4">
      <h1 class="text-2xl font-bold text-white">TempCover</h1>
      <nav class="space-x-4">
        <a href="index.html" class="text-white hover:text-[#00FF99]">Home</a>
        <a href="#" class="text-white hover:text-[#00FF99]">Logout</a>
      </nav>
    </div>
  </header>
  <div class="container">
    <h1 class="text-3xl font-bold text-center text-white mb-6">My Policies</h1>
    <table>
      <tr>
        <th>Vehicle</th>
        <th>Registration</th>
        <th>Duration</th>
        <th>Documents</th>
      </tr>
      <tr>
        <td>Audi A3</td>
        <td>N44 HMX</td>
        <td>24 Hours</td>
        <td><a href="policy.pdf" target="_blank">View Policy PDF</a></td>
      </tr>
    </table>
  </div>
</body>
</html>
