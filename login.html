<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TempCover</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #2B2F37; color: #FFFFFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-container { background-color: #1A1C22; padding: 2.5rem; border-radius: 0.5rem; box-shadow: 0 0 15px rgba(0, 255, 153, 0.2); width: 100%; max-width: 24rem; }
    .btn-primary { background-color: #00FF99; color: #2B2F37; font-weight: 600; transition: background-color 0.3s; }
    .btn-primary:hover { background-color: #00CC77; }
    .error { color: #FF6666; text-align: center; margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2 class="text-2xl font-bold text-center text-white mb-6">Account Login</h2>
    <form id="loginForm">
      <div class="mb-4">
        <label for="email" class="block text-sm mb-2">Email</label>
        <input type="email" id="email" placeholder="Enter your email" class="w-full p-3 bg-[#333741] border border-[#00FF99] rounded-md text-white" required>
      </div>
      <div class="mb-4">
        <label for="password" class="block text-sm mb-2">Password</label>
        <input type="password" id="password" placeholder="Enter your password" class="w-full p-3 bg-[#333741] border border-[#00FF99] rounded-md text-white" required>
      </div>
      <button type="submit" class="btn-primary w-full py-3 rounded-md">Login</button>
      <p class="error" id="errorMsg">Invalid email or password</p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email === 'Nahimhassan@hotmail.co.uk' && password === '#Test123') {
        window.location.href = 'account.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
